_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: slackmd
  description: Post markdown-converted messages to Slack
features:
  bot_user:
    display_name: slackmd
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
